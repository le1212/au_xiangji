<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>构图教练 · Composition Coach</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="构图教练">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-view="camera">
<div id="grain" aria-hidden="true"></div>

<!-- ============ 取景器（iOS 相机布局） ============ -->
<section id="view-camera" class="view">
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <div id="ratio-mask" aria-hidden="true"></div>
    <canvas id="overlay"></canvas>
    <div class="vf-brackets" aria-hidden="true"></div>
    <div id="vignette" aria-hidden="true"></div>

    <header id="hud">
      <div class="hud-left">
        <span id="session-tag" class="mono session-tag">NO SESSION</span>
      </div>
      <div class="hud-right">
        <span id="rec-dot" class="rec-dot" hidden></span>
        <span id="rec-label" class="mono">STANDBY</span>
        <button id="btn-archive" class="icon-btn" title="存档本组记录" aria-label="存档">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        </button>
      </div>
    </header>

    <div id="flash" aria-hidden="true"></div>
  </div>

  <!-- 底部操作区（iOS 相机 deck） -->
  <footer id="deck">
    <div id="coach-bar" class="idle">
      <div class="coach-score">
        <span class="score-num mono" id="score-num">--</span>
        <span class="score-cap">构图分</span>
      </div>
      <div class="coach-main">
        <p id="coach-instruction">打开相机，让我看看取景框里有什么</p>
        <div id="coach-issues" class="chips"></div>
      </div>
      <div id="coach-status" class="coach-status mono"></div>
    </div>

    <div class="filter-row" id="filter-row" hidden></div>

    <div class="zoom-bar-row">
      <div class="zoom-bar" id="zoom-bar" aria-hidden="true">
        <div class="zoom-bar-line"></div>
        <div id="zoom-ticks"></div>
        <div class="zoom-bar-thumb" id="zoom-thumb"><span id="zoom-thumb-label" class="mono">1.0×</span></div>
      </div>
    </div>

    <div class="zoom-row" id="zoom-row">
      <button class="zoom-pill" data-x="0.5">.5</button>
      <button class="zoom-pill active" data-x="1">1×</button>
      <button class="zoom-pill" data-x="2">2</button>
      <button id="btn-local" class="zoom-pill diag-pill" title="端侧实时教练（离线）">实时</button>
      <button id="btn-diagnose" class="zoom-pill diag-pill">诊断</button>
      <button id="btn-inspiration" class="zoom-pill diag-pill active" title="灵感构图模板（AI 按场景自动推荐）">灵感</button>
      <button id="btn-autocap" class="zoom-pill diag-pill" title="构图达标后自动抓拍（本地运行，不耗 token）">自动拍</button>
      <button id="btn-filter-toggle" class="zoom-pill filter-toggle" title="滤镜">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      </button>
    </div>

    <div class="filter-row" id="ratio-row" aria-label="成片画幅比例"></div>

    <div class="mode-strip mono" id="mode-row" aria-label="场景模式"></div>

    <div class="shutter-row">
      <button id="btn-review" class="thumb-btn" title="拍摄档案" aria-label="拍摄档案">
        <img id="last-thumb" alt="" hidden>
        <svg id="thumb-ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m21 15-4.5-4.5L9 18"/></svg>
      </button>
      <button id="btn-shutter" class="shutter-ios" title="拍下这一张" aria-label="拍照">
        <span class="shutter-inner"></span>
      </button>
      <button id="btn-flip" class="flip-btn" title="切换前后摄像头" aria-label="切换摄像头">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a9 9 0 0 1 15.5-3.5L21 7"/><path d="M21 3v4h-4"/><path d="M21 16a9 9 0 0 1-15.5 3.5L3 17"/><path d="M3 21v-4h4"/></svg>
      </button>
    </div>
  </footer>
</section>

<!-- ============ 档案列表 ============ -->
<section id="view-review" class="view page" hidden>
  <header class="page-head">
    <button class="icon-btn back" data-back aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h2>拍摄档案</h2>
    <span id="review-count" class="mono dim"></span>
  </header>
  <p class="storage-note dim">档案只存在本机浏览器：手机上建议「添加到主屏幕」使用（避免系统定期清理网页数据），重要成片在详情页「导出 JSON」备份。</p>
  <div id="review-list" class="review-list"></div>
</section>

<!-- ============ 会话详情 ============ -->
<section id="view-session" class="view page" hidden>
  <header class="page-head">
    <button class="icon-btn back" data-back aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h2 id="session-title">会话</h2>
    <div class="head-actions">
      <button id="btn-sharecard" class="ghost-btn small">提升卡</button>
      <button id="btn-export" class="ghost-btn small">导出 JSON</button>
      <button id="btn-delete" class="ghost-btn small danger">删除</button>
    </div>
  </header>
  <div class="session-detail">
    <figure class="final-shot-wrap">
      <img id="final-shot" alt="本次成片">
      <figcaption id="final-cap" class="mono dim"></figcaption>
    </figure>
    <div id="score-chart-wrap">
      <h3 class="sec-title">构图分曲线</h3>
      <div id="score-chart"></div>
    </div>
    <div id="timeline-wrap">
      <h3 class="sec-title">教练时间线</h3>
      <ol id="timeline" class="timeline"></ol>
    </div>
  </div>
</section>

<!-- ============ 设置 ============ -->
<div id="settings-modal" class="modal" hidden>
  <div class="modal-mask" data-close-settings></div>
  <div class="modal-card">
    <header class="modal-head">
      <h3>设置</h3>
      <button class="icon-btn" data-close-settings aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <label class="field-label">服务商预设</label>
    <div id="preset-row" class="preset-row">
      <button data-preset="deepseek">DeepSeek</button>
      <button data-preset="zhipu">智谱</button>
      <button data-preset="dashscope">通义</button>
      <button data-preset="openrouter">OpenRouter</button>
      <button data-preset="custom">自定义</button>
    </div>

    <label class="field-label" for="set-baseurl">API 地址（OpenAI 兼容）</label>
    <input id="set-baseurl" class="text-input mono" type="url" placeholder="https://api.deepseek.com/v1" autocomplete="off">

    <label class="field-label" for="set-model">视觉模型</label>
    <input id="set-model" class="text-input mono" type="text" placeholder="deepseek-v4-flash-vision-exp" autocomplete="off">

    <label class="field-label" for="set-key">API Key <span class="dim">（仅保存在本机浏览器）</span></label>
    <input id="set-key" class="text-input mono" type="password" placeholder="sk-…" autocomplete="off">

    <label class="check-row">
      <input type="checkbox" id="set-auto">
      <span>自动连续诊断（每几秒消耗一次 token，省 token 请保持关闭，用手动「诊断」按钮）</span>
    </label>

    <label class="field-label" for="set-interval">自动模式诊断间隔 <span id="interval-val" class="mono accent"></span></label>
    <input id="set-interval" class="range-input" type="range" min="1000" max="5000" step="250">

    <div class="set-actions">
      <button id="btn-test" class="ghost-btn">测试连接</button>
      <button id="btn-save-settings" class="ghost-btn primary">保存</button>
    </div>
    <p class="privacy-note">画面帧只会发送到你上面配置的模型服务商，用于构图分析；本应用没有自己的服务器，不收集任何数据。</p>
  </div>
</div>

<!-- ============ 拍摄确认预览 ============ -->
<div id="preview-modal" class="modal" hidden>
  <div class="preview-body">
    <img id="preview-img" alt="拍摄预览">
  </div>
  <footer class="preview-actions">
    <button id="btn-retake" class="preview-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a9 9 0 0 1 15.5-3.5L21 7"/><path d="M21 3v4h-4"/><path d="M21 16a9 9 0 0 1-15.5 3.5L3 17"/><path d="M3 21v-4h4"/></svg>
      <span>重拍</span>
    </button>
    <button id="btn-keep" class="preview-btn keep">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <span>用这张</span>
    </button>
  </footer>
</div>

<div id="toast" class="mono"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
